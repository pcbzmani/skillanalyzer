<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ICT Skills Library — Singapore Framework</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080f1c;--panel:#0e1828;--card:#111e33;--card2:#13243d;
  --line:#1a2d4a;--ink:#e4ecfc;--muted:#7a91b8;--dim:#4a6080;
  --brand:#4f83e3;--brand2:#7c5cff;--green:#22c55e;--amber:#f59e0b;
  --red:#ef4444;--teal:#14b8a6;--pink:#ec4899;
  --emerald:#10b981;--violet:#8b5cf6;
  --radius:14px;--card-r:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Inter,Arial,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}

/* ── Header ── */
header{
  padding:20px 28px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#0a1525,#080f1c);
  display:flex;align-items:center;gap:16px;flex-wrap:wrap
}
.logo{width:42px;height:42px;border-radius:11px;flex-shrink:0;
  background:conic-gradient(from 200deg,var(--brand),var(--brand2),var(--brand));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 6px 24px rgba(79,131,227,.35)}
.header-text h1{font-size:19px;font-weight:700}
.header-text p{font-size:12px;color:var(--muted);margin-top:2px}
.header-stats{margin-left:auto;display:flex;gap:20px}
.stat{text-align:center}
.stat-n{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--brand),var(--brand2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-l{font-size:11px;color:var(--muted)}

/* ── Controls ── */
.controls{
  position:sticky;top:0;z-index:40;
  background:rgba(8,15,28,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:14px 28px;
  display:flex;flex-direction:column;gap:12px
}
.ctrl-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px;max-width:360px}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;opacity:.45;pointer-events:none}
#searchBox{
  width:100%;padding:9px 12px 9px 36px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);
  color:var(--ink);font-size:14px;outline:none;
  transition:border-color .15s
}
#searchBox:focus{border-color:var(--brand)}
#searchBox::placeholder{color:var(--dim)}

.filter-btn{
  padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:13px;cursor:pointer;
  transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:6px
}
.filter-btn:hover,.filter-btn.active{
  background:var(--brand);border-color:var(--brand);color:#fff
}
.filter-btn.emerging-btn.active{background:var(--emerald);border-color:var(--emerald)}
.filter-btn.emerging-btn{border-color:var(--emerald);color:var(--emerald)}

.lvl-filter{display:flex;gap:6px}
.lvl-btn{
  padding:6px 14px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:12px;cursor:pointer;
  transition:all .15s;font-weight:600
}
.lvl-btn.active,.lvl-btn:hover{border-color:var(--brand2);color:var(--brand2);background:rgba(124,92,255,.12)}

.cats-wrap{display:flex;gap:6px;flex-wrap:wrap}
.cat-pill{
  padding:5px 11px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;
  transition:all .15s;white-space:nowrap
}
.cat-pill:hover,.cat-pill.active{
  background:rgba(79,131,227,.2);border-color:var(--brand);color:var(--brand)
}
.pill-cnt{opacity:.6;font-weight:400}

.results-info{font-size:12px;color:var(--dim);padding:0 28px 6px}

/* ── Grid ── */
main{flex:1;padding:20px 28px;display:flex;flex-direction:column;gap:20px}
.skills-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:16px
}

/* ── Card ── */
.skill-card{
  background:linear-gradient(160deg,var(--card),var(--card2));
  border:1px solid var(--line);border-radius:var(--card-r);
  padding:0;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;
  position:relative;overflow:hidden;
}
.skill-card::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(360px 180px at 0% 0%,rgba(79,131,227,.07),transparent 60%);
  pointer-events:none
}
.skill-card:hover{transform:translateY(-2px);border-color:#2a3f66;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.skill-card.expanded{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.card-head{padding:18px 18px 14px}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.badge-cat{
  font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;
  background:rgba(79,131,227,.15);color:var(--brand);border:1px solid rgba(79,131,227,.3)
}
.badge-emerging{
  font-size:10px;font-weight:700;padding:3px 9px;border-radius:999px;
  background:rgba(16,185,129,.15);color:var(--emerald);border:1px solid rgba(16,185,129,.35);
  display:flex;align-items:center;gap:4px
}
.badge-emerging::before{content:'✦';font-size:8px}
.badge-sfia{
  font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;
  background:rgba(124,92,255,.12);color:var(--brand2);border:1px solid rgba(124,92,255,.25);
  margin-left:auto
}
.card-title{font-size:15px;font-weight:700;margin-bottom:8px;line-height:1.3}
.card-desc{font-size:12.5px;color:var(--muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-tsc{font-size:10.5px;color:var(--dim);margin-top:8px;font-family:monospace}
.expand-hint{
  font-size:11px;color:var(--brand);margin-top:10px;
  display:flex;align-items:center;gap:4px;opacity:.7
}
.expand-arrow{transition:transform .2s;display:inline-block}
.skill-card.expanded .expand-arrow{transform:rotate(180deg)}

/* ── Proficiency bar ── */
.prof-bar{
  display:flex;border-top:1px solid var(--line);overflow:hidden
}
.prof-seg{
  flex:1;padding:6px 0;text-align:center;font-size:10px;font-weight:700;
  cursor:pointer;transition:background .15s;color:var(--muted);position:relative
}
.prof-seg:not(:last-child){border-right:1px solid var(--line)}
.prof-seg.has-data:hover,.prof-seg.has-data.sel{color:#fff}
.prof-seg.has-data.sel.lv1{background:rgba(20,184,166,.25);color:var(--teal)}
.prof-seg.has-data.sel.lv2{background:rgba(79,131,227,.25);color:var(--brand)}
.prof-seg.has-data.sel.lv3{background:rgba(245,158,11,.25);color:var(--amber)}
.prof-seg.has-data.sel.lv4{background:rgba(139,92,246,.25);color:var(--violet)}
.prof-seg.no-data{opacity:.3;cursor:default}
.prof-lv-num{font-size:14px;display:block}
.prof-lv-txt{font-size:9px;opacity:.8;display:block}

/* ── Expanded Panel ── */
.expanded-panel{
  display:none;border-top:1px solid var(--line);
  background:rgba(0,0,0,.25)
}
.skill-card.expanded .expanded-panel{display:block}

.panel-tabs{display:flex;border-bottom:1px solid var(--line)}
.ptab{
  padding:10px 16px;font-size:12px;font-weight:600;cursor:pointer;
  color:var(--muted);border-bottom:2px solid transparent;transition:all .15s
}
.ptab.active{color:var(--ink);border-bottom-color:var(--brand)}
.tab-content{display:none;padding:16px 18px}
.tab-content.active{display:block}

/* Level details */
.lvl-detail{display:flex;flex-direction:column;gap:12px}
.lvl-block{
  border-radius:8px;border:1px solid var(--line);
  overflow:hidden
}
.lvl-header{
  padding:10px 14px;display:flex;align-items:center;gap:10px;
  cursor:pointer
}
.lvl-header.lv1{background:rgba(20,184,166,.1)}
.lvl-header.lv2{background:rgba(79,131,227,.1)}
.lvl-header.lv3{background:rgba(245,158,11,.1)}
.lvl-header.lv4{background:rgba(139,92,246,.1)}
.lvl-num{
  width:28px;height:28px;border-radius:7px;display:grid;place-items:center;
  font-size:12px;font-weight:800;flex-shrink:0
}
.lvl-num.lv1{background:rgba(20,184,166,.2);color:var(--teal)}
.lvl-num.lv2{background:rgba(79,131,227,.2);color:var(--brand)}
.lvl-num.lv3{background:rgba(245,158,11,.2);color:var(--amber)}
.lvl-num.lv4{background:rgba(139,92,246,.2);color:var(--violet)}
.lvl-name{font-size:13px;font-weight:700}
.lvl-pdesc{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;
  max-width:55%;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.lvl-body{padding:12px 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:600px){.lvl-body{grid-template-columns:1fr}}
.ka-section h5{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.8px;color:var(--dim);margin-bottom:8px}
.ka-list{list-style:none;display:flex;flex-direction:column;gap:4px}
.ka-list li{
  font-size:11.5px;color:var(--muted);line-height:1.4;padding:4px 8px;
  background:rgba(255,255,255,.03);border-radius:5px;
  border-left:2px solid var(--line);
}
.ka-list li.k-item{border-left-color:rgba(79,131,227,.5);color:#9ab8f0}
.ka-list li.a-item{border-left-color:rgba(16,185,129,.5);color:#86e3c0}

/* Sources tab */
.sources-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.sources-grid{grid-template-columns:1fr}}
.source-card{
  border-radius:8px;border:1px solid var(--line);padding:12px;
  background:rgba(255,255,255,.02)
}
.source-label{font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.7px;margin-bottom:8px}
.source-label.sg{color:#00d4aa}
.source-label.sfia{color:var(--brand2)}
.source-label.esco{color:var(--amber)}
.source-label.unified{color:var(--brand)}
.source-text{font-size:12px;color:var(--muted);line-height:1.6}
.source-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;padding:2px 7px;border-radius:4px;margin-bottom:6px
}
.source-badge.sg{background:rgba(0,212,170,.1);color:#00d4aa;border:1px solid rgba(0,212,170,.25)}
.source-badge.sfia{background:rgba(124,92,255,.1);color:var(--brand2);border:1px solid rgba(124,92,255,.25)}
.source-badge.esco{background:rgba(245,158,11,.1);color:var(--amber);border:1px solid rgba(245,158,11,.25)}

/* Empty state */
.empty-state{
  grid-column:1/-1;text-align:center;padding:64px 24px;color:var(--dim)
}
.empty-state svg{width:48px;height:48px;opacity:.3;margin-bottom:16px}
.empty-state p{font-size:15px}

/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* No-data message */
.no-lvl{
  grid-column:1/-1;padding:12px;border-radius:7px;
  background:rgba(255,255,255,.03);color:var(--dim);
  font-size:12px;text-align:center
}

/* Level nav inside expanded panel */
.lvl-nav{display:flex;border-bottom:1px solid var(--line);background:rgba(0,0,0,.2)}
.lvl-nav-btn{
  flex:1;padding:10px 6px;border:none;background:none;cursor:pointer;
  font-size:11px;font-weight:600;color:var(--muted);
  border-bottom:3px solid transparent;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:3px
}
.lvl-nav-btn .lv-n{font-size:16px;font-weight:800;line-height:1}
.lvl-nav-btn .lv-t{font-size:9px;opacity:.8}
.lvl-nav-btn:not(.disabled):hover{color:var(--ink);background:rgba(255,255,255,.04)}
.lvl-nav-btn.disabled{opacity:.25;cursor:not-allowed}
.lvl-nav-btn.active.lv1{color:var(--teal);border-bottom-color:var(--teal);background:rgba(20,184,166,.07)}
.lvl-nav-btn.active.lv2{color:var(--brand);border-bottom-color:var(--brand);background:rgba(79,131,227,.07)}
.lvl-nav-btn.active.lv3{color:var(--amber);border-bottom-color:var(--amber);background:rgba(245,158,11,.07)}
.lvl-nav-btn.active.lv4{color:var(--violet);border-bottom-color:var(--violet);background:rgba(139,92,246,.07)}

@media(max-width:640px){
  header{padding:14px 16px}
  .controls,.main{padding:12px 16px}
  .header-stats{width:100%;justify-content:space-around;margin-left:0}
  .skills-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="logo">ICT</div>
  <div class="header-text">
    <h1>ICT Skills Library</h1>
    <p>Singapore SkillsFuture &nbsp;&#183;&nbsp; SFIA-9 &nbsp;&#183;&nbsp; ESCO &nbsp;&#183;&nbsp; Proficiency levels 1–4</p>
  </div>
  <div class="header-stats">
    <div class="stat"><div class="stat-n">154</div><div class="stat-l">Total Skills</div></div>
    <div class="stat"><div class="stat-n">27</div><div class="stat-l">Emerging</div></div>
    <div class="stat"><div class="stat-n">18</div><div class="stat-l">Categories</div></div>
    <div class="stat"><div class="stat-n">4</div><div class="stat-l">Proficiency Levels</div></div>
  </div>
</header>

<div class="controls">
  <div class="ctrl-row">
    <div class="search-wrap">
      <svg viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 100 11 5.5 5.5 0 000-11zM2 9a7 7 0 1112.452 4.391l3.328 3.329a.75.75 0 11-1.06 1.06l-3.329-3.328A7 7 0 012 9z" clip-rule="evenodd"/>
      </svg>
      <input id="searchBox" type="search" placeholder="Search skills, descriptions, SFIA codes…" autocomplete="off"/>
    </div>
    <button class="filter-btn emerging-btn" id="emergingToggle">
      <span>&#10022;</span> Emerging Skills
    </button>
    <div style="position:relative;margin-left:auto">
      <button class="filter-btn" id="downloadBtn" onclick="toggleDownloadMenu()" style="gap:6px">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v7.586l2.293-2.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 111.414-1.414L9 11.586V4a1 1 0 011-1zM3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>
        Download Data
      </button>
      <div id="downloadMenu" style="display:none;position:absolute;right:0;top:calc(100% + 6px);background:#0e1828;border:1px solid #1a2d4a;border-radius:10px;min-width:200px;z-index:100;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.5)">
        <div style="padding:8px 0">
          <div style="padding:6px 14px 8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#4a6080">Export current view</div>
          <button onclick="downloadFiltered('csv')" style="width:100%;padding:10px 16px;background:none;border:none;color:#e4ecfc;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='rgba(79,131,227,.12)'" onmouseout="this.style.background='none'">
            <span style="font-size:16px">&#128196;</span> Download CSV
            <span style="font-size:11px;color:#4a6080;margin-left:auto">spreadsheet</span>
          </button>
          <button onclick="downloadFiltered('json')" style="width:100%;padding:10px 16px;background:none;border:none;color:#e4ecfc;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='rgba(79,131,227,.12)'" onmouseout="this.style.background='none'">
            <span style="font-size:16px">&#128736;</span> Download JSON
            <span style="font-size:11px;color:#4a6080;margin-left:auto">full data</span>
          </button>
          <hr style="border:none;border-top:1px solid #1a2d4a;margin:4px 0"/>
          <div style="padding:6px 14px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:#4a6080">All 154 skills</div>
          <button onclick="downloadAll('csv')" style="width:100%;padding:10px 16px;background:none;border:none;color:#e4ecfc;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='rgba(79,131,227,.12)'" onmouseout="this.style.background='none'">
            <span style="font-size:16px">&#128196;</span> All Skills CSV
            <span style="font-size:11px;color:#4a6080;margin-left:auto">complete</span>
          </button>
          <button onclick="downloadAll('json')" style="width:100%;padding:10px 16px;background:none;border:none;color:#e4ecfc;font-size:13px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='rgba(79,131,227,.12)'" onmouseout="this.style.background='none'">
            <span style="font-size:16px">&#128736;</span> All Skills JSON
            <span style="font-size:11px;color:#4a6080;margin-left:auto">complete</span>
          </button>
        </div>
      </div>
    </div>
    <div class="lvl-filter">
      <button class="lvl-btn active" data-lvl="all">All Levels</button>
      <button class="lvl-btn" data-lvl="1">L1 Foundation</button>
      <button class="lvl-btn" data-lvl="2">L2 Intermediate</button>
      <button class="lvl-btn" data-lvl="3">L3 Advanced</button>
      <button class="lvl-btn" data-lvl="4">L4 Expert</button>
    </div>
  </div>
  <div class="ctrl-row cats-wrap" id="catPills">
    <button class="cat-pill active" data-cat="all">All Categories</button>
    <button class="cat-pill" data-cat="Analytical Thinking">Analytical Thinking <span class="pill-cnt">1</span></button>
<button class="cat-pill" data-cat="Business Development">Business Development <span class="pill-cnt">3</span></button>
<button class="cat-pill" data-cat="Business Finance">Business Finance <span class="pill-cnt">1</span></button>
<button class="cat-pill" data-cat="Business and Project Management">Business and Project Management <span class="pill-cnt">20</span></button>
<button class="cat-pill" data-cat="Design and Architecture">Design and Architecture <span class="pill-cnt">14</span></button>
<button class="cat-pill" data-cat="Development and Implementation">Development and Implementation <span class="pill-cnt">34</span></button>
<button class="cat-pill" data-cat="GenAI">GenAI <span class="pill-cnt">9</span></button>
<button class="cat-pill" data-cat="General Management">General Management <span class="pill-cnt">2</span></button>
<button class="cat-pill" data-cat="Governance and Compliance">Governance and Compliance <span class="pill-cnt">9</span></button>
<button class="cat-pill" data-cat="Operations and User Support">Operations and User Support <span class="pill-cnt">15</span></button>
<button class="cat-pill" data-cat="People Development">People Development <span class="pill-cnt">2</span></button>
<button class="cat-pill" data-cat="Project Management">Project Management <span class="pill-cnt">1</span></button>
<button class="cat-pill" data-cat="Risk Management, Governance and Regulatory Compliance">Risk Management, Governance and Regulatory Compliance <span class="pill-cnt">6</span></button>
<button class="cat-pill" data-cat="Sales and Marketing">Sales and Marketing <span class="pill-cnt">22</span></button>
<button class="cat-pill" data-cat="Stakeholder and Contract Management">Stakeholder and Contract Management <span class="pill-cnt">5</span></button>
<button class="cat-pill" data-cat="Strategy Planning and Implementation">Strategy Planning and Implementation <span class="pill-cnt">6</span></button>
<button class="cat-pill" data-cat="Strategy and Architecture">Strategy and Architecture <span class="pill-cnt">2</span></button>
<button class="cat-pill" data-cat="Technology Management">Technology Management <span class="pill-cnt">2</span></button>

  </div>
</div>

<div class="results-info" id="resultsInfo">&nbsp;</div>

<main>
  <div class="skills-grid" id="skillsGrid">
    <!-- populated by JS -->
  </div>
</main>

<!-- ══════════════════════════════════════════
     EMBEDDED DATA — all skills + proficiency
     extract with: JSON.parse(document.getElementById('SKILLS_DATA').textContent)

<script>
(function(){
  'use strict';

  // ── Data ──────────────────────────────────
  const SKILLS = JSON.parse(document.getElementById('SKILLS_DATA').textContent);

  const LEVEL_COLORS = {1:'teal',2:'brand',3:'amber',4:'violet'};
  const LEVEL_HEX    = {1:'#14b8a6',2:'#4f83e3',3:'#f59e0b',4:'#8b5cf6'};

  // ── State ─────────────────────────────────
  let filterCat      = 'all';
  let filterEmerging = false;
  let filterLvl      = 'all';
  let searchQuery    = '';
  let expandedId     = null;
  let activeProfLvl  = {};  // skill id → selected level tab

  // ── Utils ─────────────────────────────────
  function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

  function matchesSearch(s, q){
    if(!q) return true;
    const lower = q.toLowerCase();
    return s.title.toLowerCase().includes(lower)
      || (s.unifiedDescription||'').toLowerCase().includes(lower)
      || (s.category||'').toLowerCase().includes(lower)
      || (s.sfiaCode||'').toLowerCase().includes(lower)
      || (s.tscCode||'').toLowerCase().includes(lower);
  }

  function getFiltered(){
    return SKILLS.filter(s => {
      if(filterCat !== 'all' && s.category !== filterCat) return false;
      if(filterEmerging && !s.isEmerging) return false;
      if(filterLvl !== 'all') {
        const lvl = parseInt(filterLvl);
        if(!s.levels || !s.levels[lvl] || !s.levels[lvl].proficiency_description) return false;
      }
      if(!matchesSearch(s, searchQuery)) return false;
      return true;
    });
  }

  // ── Render ────────────────────────────────
  function renderProfBar(s){
    let html = '<div class="prof-bar">';
    for(let lv=1;lv<=4;lv++){
      const lvData = s.levels && s.levels[lv];
      const hasData = lvData && lvData.proficiency_description;
      const isSelected = activeProfLvl[s.id] === lv;
      const cls = [
        'prof-seg',
        hasData ? 'has-data' : 'no-data',
        isSelected ? `sel lv${lv}` : ''
      ].join(' ');
      const names = ['Foundation','Intermediate','Advanced','Expert'];
      html += `<div class="${cls}" data-sid="${esc(s.id)}" data-lv="${lv}" onclick="toggleLevel('${s.id}',${lv})">
        <span class="prof-lv-num">L${lv}</span>
        <span class="prof-lv-txt">${names[lv-1]}</span>
      </div>`;
    }
    return html + '</div>';
  }

  function renderLvlBlock(s, lv){
    const lvData = s.levels && s.levels[lv];
    if(!lvData || !lvData.proficiency_description) {
      return `<div class="no-lvl">Level ${lv} data not available for this skill</div>`;
    }
    const names = ['Foundation','Intermediate','Advanced','Expert'];
    const pdesc = esc(lvData.proficiency_description);
    const kItems = (lvData.knowledge||[]).map(k=>`<li class="k-item">${esc(k)}</li>`).join('');
    const aItems = (lvData.ability||[]).map(a=>`<li class="a-item">${esc(a)}</li>`).join('');
    return `
    <div class="lvl-block">
      <div class="lvl-header lv${lv}">
        <div class="lvl-num lv${lv}">${lv}</div>
        <div class="lvl-name">${names[lv-1]}</div>
        <div class="lvl-pdesc">${pdesc}</div>
      </div>
      <div class="lvl-body">
        <div>
          <h5>&#128218; Knowledge</h5>
          <ul class="ka-list">${kItems || '<li class="k-item" style="opacity:.5">No knowledge items listed</li>'}</ul>
        </div>
        <div>
          <h5>&#9889; Abilities</h5>
          <ul class="ka-list">${aItems || '<li class="a-item" style="opacity:.5">No ability items listed</li>'}</ul>
        </div>
      </div>
    </div>`;
  }

  function renderExpandedPanel(s){
    const curLv  = activeProfLvl[s.id] || 1;
    const lvNames = ['Foundation','Intermediate','Advanced','Expert'];

    // Level nav (L1–L4 tabs at top of panel)
    const navBtns = [1,2,3,4].map(lv => {
      const hasData = s.levels && s.levels[lv] && s.levels[lv].proficiency_description;
      const isAct   = lv === curLv;
      const cls     = ['lvl-nav-btn', isAct ? `active lv${lv}` : '', !hasData ? 'disabled' : ''].join(' ');
      const handler = hasData ? `onclick="switchLevel('${s.id}',${lv},event)"` : '';
      return `<button class="${cls}" ${handler}>
        <span class="lv-n">L${lv}</span>
        <span class="lv-t">${lvNames[lv-1]}</span>
      </button>`;
    }).join('');

    const sfiaDesc = s.sfiaDescription
      ? `<div class="source-badge sfia">SFIA-9 &#183; ${esc(s.sfiaCode||'')}</div><p class="source-text">${esc(s.sfiaDescription)}</p>`
      : `<p class="source-text" style="color:var(--dim)">No direct SFIA-9 equivalent mapped</p>`;
    const sgDesc = s.sgDescription
      ? `<p class="source-text">${esc(s.sgDescription)}</p>` : '';

    return `
    <div class="expanded-panel">
      <div class="lvl-nav">${navBtns}</div>
      <div class="panel-tabs" id="tabs-${s.id}">
        <div class="ptab active" data-tab="levels" onclick="switchTab('${s.id}','levels')">Level ${curLv} &mdash; ${lvNames[curLv-1]}</div>
        <div class="ptab" data-tab="sources" onclick="switchTab('${s.id}','sources')">Source Frameworks</div>
      </div>
      <div class="tab-content active" id="tab-levels-${s.id}">
        ${renderLvlBlock(s, curLv)}
      </div>
      <div class="tab-content" id="tab-sources-${s.id}">
        <div class="sources-grid">
          <div class="source-card">
            <div class="source-label unified">&#9670; Unified Description</div>
            <p class="source-text">${esc(s.unifiedDescription||'')}</p>
          </div>
          <div class="source-card">
            <div class="source-label sg">&#127480;&#127468; SkillsFuture Singapore</div>
            <div class="source-badge sg">TSC &#183; ${esc(s.tscCode||'')}</div>
            ${sgDesc}
          </div>
          <div class="source-card">
            <div class="source-label sfia">&#128187; SFIA-9</div>
            ${sfiaDesc}
          </div>
          <div class="source-card">
            <div class="source-label esco">&#127466;&#127482; ESCO</div>
            <div class="source-badge esco">EU Skills Taxonomy v1.2.1</div>
            <p class="source-text" style="color:var(--dim);font-style:italic">
              Cross-reference available via ESCO digital skills collection.
              Skill reuse level: <strong style="color:var(--muted)">${s.isEmerging ? 'emerging / cross-sector' : 'cross-sector'}</strong>
            </p>
          </div>
        </div>
      </div>
    </div>`;
  }

  function renderCard(s){
    const expanded = expandedId === s.id;
    const emerBadge = s.isEmerging
      ? '<span class="badge-emerging">Emerging</span>' : '';
    const sfiaBadge = s.sfiaCode
      ? `<span class="badge-sfia">SFIA ${esc(s.sfiaCode)}</span>` : '';
    const descText = esc(s.unifiedDescription || s.sgDescription || '');
    return `
    <div class="skill-card${expanded?' expanded':''}" id="card-${s.id}"
         data-id="${s.id}" data-cat="${esc(s.category)}"
         data-emerging="${s.isEmerging?'1':'0'}"
         data-sfia="${esc(s.sfiaCode||'')}"
         data-tsc="${esc(s.tscCode||'')}"
         onclick="toggleCard('${s.id}',event)">
      <div class="card-head">
        <div class="card-meta">
          <span class="badge-cat">${esc(s.category)}</span>
          ${emerBadge}
          ${sfiaBadge}
        </div>
        <div class="card-title">${esc(s.title)}</div>
        <div class="card-desc">${descText}</div>
        <div class="card-tsc">${esc(s.tscCode||'')}</div>
        <div class="expand-hint">
          <span>${expanded?'Hide details':'Show proficiency levels'}</span>
          <span class="expand-arrow">&#8964;</span>
        </div>
      </div>
      ${renderProfBar(s)}
      ${expanded ? renderExpandedPanel(s) : '<div class="expanded-panel"></div>'}
    </div>`;
  }

  function render(){
    const filtered = getFiltered();
    const grid = document.getElementById('skillsGrid');
    const info = document.getElementById('resultsInfo');
    info.textContent = `Showing ${filtered.length} of ${SKILLS.length} skills`;
    if(filtered.length===0){
      grid.innerHTML=`<div class="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <p>No skills match your filters</p>
      </div>`;
      return;
    }
    grid.innerHTML = filtered.map(s=>renderCard(s)).join('');
  }

  // ── Interactions ──────────────────────────
  window.toggleCard = function(id, e){
    // Don't collapse when clicking inside expanded panel, prof-bar, level-nav, or tabs
    if(e && e.target.closest('.expanded-panel,.prof-seg,.ptab,.lvl-nav-btn')) return;
    if(expandedId === id){
      expandedId = null;
    } else {
      expandedId = id;
      if(!activeProfLvl[id]) activeProfLvl[id] = 1;
    }
    render();
    if(expandedId){
      setTimeout(()=>{
        const el = document.getElementById('card-'+id);
        if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
      },50);
    }
  };

  // Targeted card re-render (no full grid repaint, no scroll jump)
  function rerenderCard(id){
    const s = SKILLS.find(x => x.id === id);
    if(!s) return;
    const old = document.getElementById('card-' + id);
    if(!old) return;
    const tmp = document.createElement('div');
    tmp.innerHTML = renderCard(s);
    old.replaceWith(tmp.firstElementChild);
  }

  // Clicking prof-bar segment: select level + expand card
  window.toggleLevel = function(id, lv, e){
    if(e) e.stopPropagation();
    activeProfLvl[id] = lv;
    expandedId = id;
    rerenderCard(id);
  };

  // Switching level inside the expanded panel
  window.switchLevel = function(id, lv, e){
    if(e) e.stopPropagation();
    activeProfLvl[id] = lv;
    rerenderCard(id);
  };

  window.switchTab = function(id, tab){
    const container = document.getElementById('tabs-'+id);
    if(container){
      container.querySelectorAll('.ptab').forEach(t=>
        t.classList.toggle('active', t.dataset.tab===tab));
    }
    ['levels','sources'].forEach(t=>{
      const el = document.getElementById('tab-'+t+'-'+id);
      if(el) el.classList.toggle('active', t===tab);
    });
  };

  // ── Filter events ─────────────────────────
  document.getElementById('searchBox').addEventListener('input', function(){
    searchQuery = this.value.trim();
    render();
  });

  document.getElementById('emergingToggle').addEventListener('click', function(){
    filterEmerging = !filterEmerging;
    this.classList.toggle('active', filterEmerging);
    render();
  });

  document.querySelectorAll('.lvl-btn').forEach(btn=>{
    btn.addEventListener('click', function(){
      document.querySelectorAll('.lvl-btn').forEach(b=>b.classList.remove('active'));
      this.classList.add('active');
      filterLvl = this.dataset.lvl;
      render();
    });
  });

  document.getElementById('catPills').addEventListener('click', function(e){
    const pill = e.target.closest('.cat-pill');
    if(!pill) return;
    document.querySelectorAll('.cat-pill').forEach(p=>p.classList.remove('active'));
    pill.classList.add('active');
    filterCat = pill.dataset.cat;
    render();
  });

  // ── Init ─────────────────────────────────
  render();
})();

// ── Download helpers (global scope) ──────────────────────────────────────────
function toggleDownloadMenu(){
  const m = document.getElementById('downloadMenu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', function(e){
  if(!e.target.closest('#downloadBtn') && !e.target.closest('#downloadMenu')){
    const m = document.getElementById('downloadMenu');
    if(m) m.style.display = 'none';
  }
});

function skillsToCSV(arr){
  const esc = v => '"' + String(v||'').replace(/"/g,'""') + '"';
  const headers = [
    'ID','Title','Category','IsEmerging','SFIACode','SFIAName','TSCCode',
    'UnifiedDescription','SGDescription','SFIADescription',
    'L1_Label','L1_ProficiencyDescription','L1_Knowledge','L1_Ability',
    'L2_Label','L2_ProficiencyDescription','L2_Knowledge','L2_Ability',
    'L3_Label','L3_ProficiencyDescription','L3_Knowledge','L3_Ability',
    'L4_Label','L4_ProficiencyDescription','L4_Knowledge','L4_Ability'
  ];
  const rows = arr.map(s => {
    const lv = s.levels || {};
    const lvRow = [1,2,3,4].flatMap(n => {
      const l = lv[n] || {};
      return [
        l.label || '',
        l.proficiency_description || '',
        (l.knowledge||[]).join(' | '),
        (l.ability||[]).join(' | ')
      ];
    });
    return [
      s.id, s.title, s.category, s.isEmerging ? 'Yes' : 'No',
      s.sfiaCode||'', s.sfiaName||'', s.tscCode||'',
      s.unifiedDescription||'', s.sgDescription||'', s.sfiaDescription||'',
      ...lvRow
    ].map(esc).join(',');
  });
  return [headers.map(h=>'"'+h+'"').join(','), ...rows].join('\r\n');
}

function triggerDownload(content, filename, mime){
  const blob = new Blob([content], {type: mime});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  document.getElementById('downloadMenu').style.display = 'none';
}

function getFilteredSkills(){
  const SKILLS = JSON.parse(document.getElementById('SKILLS_DATA').textContent);
  const search  = document.getElementById('searchBox').value.trim().toLowerCase();
  const catEl   = document.querySelector('.cat-pill.active');
  const cat     = catEl ? catEl.dataset.cat : 'all';
  const lvlEl   = document.querySelector('.lvl-btn.active');
  const lvl     = lvlEl ? lvlEl.dataset.lvl : 'all';
  const emerging = document.getElementById('emergingToggle').classList.contains('active');
  return SKILLS.filter(s => {
    if(cat !== 'all' && s.category !== cat) return false;
    if(emerging && !s.isEmerging) return false;
    if(lvl !== 'all'){
      const l = parseInt(lvl);
      if(!s.levels||!s.levels[l]||!s.levels[l].proficiency_description) return false;
    }
    if(search){
      return (s.title+'|'+s.unifiedDescription+'|'+s.category+'|'+(s.sfiaCode||'')+'|'+(s.tscCode||''))
        .toLowerCase().includes(search);
    }
    return true;
  });
}

function downloadFiltered(fmt){
  const data = getFilteredSkills();
  const ts   = new Date().toISOString().slice(0,10);
  if(fmt==='csv'){
    triggerDownload(skillsToCSV(data), `ict-skills-filtered-${ts}.csv`, 'text/csv;charset=utf-8;');
  } else {
    triggerDownload(JSON.stringify(data, null, 2), `ict-skills-filtered-${ts}.json`, 'application/json');
  }
}

function downloadAll(fmt){
  const SKILLS = JSON.parse(document.getElementById('SKILLS_DATA').textContent);
  const ts = new Date().toISOString().slice(0,10);
  if(fmt==='csv'){
    triggerDownload(skillsToCSV(SKILLS), `ict-skills-all-${ts}.csv`, 'text/csv;charset=utf-8;');
  } else {
    triggerDownload(JSON.stringify(SKILLS, null, 2), `ict-skills-all-${ts}.json`, 'application/json');
  }
}
</script>
